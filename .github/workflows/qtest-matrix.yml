name: qtest-matrix

# Register-level qtest regression (tests/qtest/ws63-test) across a
# MATRIX of QEMU base releases. This is the phase-6 maintainability radar: the
# WS63 model is an out-of-tree overlay (the copied ws63.c / xlinx decoder / qtest
# + a PER-VERSION patch-series under patches/<tag>/, applied by scripts/build.sh).
# The #1 maintenance risk is a new QEMU release shifting the files the series
# touches; each supported version therefore keeps its own series, and this matrix
# proves every supported version still applies/builds/passes.
#
# - A version with a patches/<tag>/ dir is REQUIRED (must stay green).
# - A newer version with no series yet is EXPERIMENTAL (continue-on-error):
#   build.sh fails "not ported", which is the "add patches/<tag>/" signal — not a
#   merge blocker.
#
# qtest drives device models over MMIO. The additional priority regression runs
# small first-party RISC-V instructions under TCG to test CSR RMW, traps and
# threshold arbitration. Neither path needs Rust or vendor firmware.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly-tagged QEMU that breaks the overlay shows up even with
    # no repo activity.
    - cron: "0 6 * * 1"

# Newer pushes supersede in-flight runs on the same ref.
concurrency:
  group: qtest-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qtest:
    name: qtest (QEMU ${{ matrix.qemu_tag }})
    runs-on: ubuntu-latest
    # Non-required cells may fail without failing the workflow.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported versions — each has its own series under patches/<tag>/,
          # verified to apply, build, and pass qtest. Blocking.
          - qemu_tag: v11.0.1   # newest stable major, ported
            required: true
          - qemu_tag: v10.2.3   # newest 10.2.x, ported
            required: true
          - qemu_tag: v10.0.0   # current default baseline
            required: true
          - qemu_tag: v9.2.4    # previous pin, kept maintained
            required: true
          # FORWARD-COMPAT RADAR: when QEMU ships a release newer than v11.0.1,
          # add it here as an experimental cell:
          #   - qemu_tag: v11.1.0    # or v12.0.0, etc.
          #     required: false
          # It will fail "not ported" (no patches/<tag>/) until the series is
          # rebased — that red, non-blocking cell is the "port the next QEMU"
          # signal. v11.0.1 is currently the newest stable tag, so there is no
          # radar cell yet; all supported versions are green.

    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: bash scripts/setup-deps.sh

      - name: Cache QEMU build
        uses: actions/cache@v5
        with:
          path: qemu
          # Key on the QEMU tag too (each cell builds its own tree), plus every
          # overlay input that scripts/build.sh injects.
          key: qtest-${{ matrix.qemu_tag }}-${{ hashFiles('src/**', 'patches/**', 'scripts/build.sh') }}-${{ runner.os }}

      - name: Build WS63 QEMU + qtest (${{ matrix.qemu_tag }})
        run: QEMU_TAG=${{ matrix.qemu_tag }} bash scripts/build.sh

      - name: QTest (register-level regression)
        run: bash scripts/qtest.sh

      - uses: astral-sh/setup-uv@v7

      - name: Shared priority/CSR reset contracts on WS63 and BS2X (TCG)
        run: |
          uv run --script scripts/hisi_priority_test.py --qemu ./qemu/build/qemu-system-riscv32 \
            --machines ws63 bs20 bs21 bs21e bs22

      - name: WS53 timer contracts (supported WS53 base)
        if: matrix.qemu_tag == 'v10.0.0'
        run: uv run --script scripts/test-ws53.py --qemu ./qemu/build/qemu-system-riscv32

      - name: WS53 Flash control-domain access and reset contracts
        if: matrix.qemu_tag == 'v10.0.0'
        run: |
          uv run --script scripts/ws53_tsensor_domain_test.py \
            --qemu ./qemu/build/qemu-system-riscv32 \
            --output "$RUNNER_TEMP/ws53-tsensor-domain"

      - name: Retain control-domain model observations
        if: always() && matrix.qemu_tag == 'v10.0.0'
        uses: actions/upload-artifact@v4
        with:
          name: ws53-tsensor-control-domain-${{ matrix.qemu_tag }}
          path: ${{ runner.temp }}/ws53-tsensor-domain/
          if-no-files-found: warn
