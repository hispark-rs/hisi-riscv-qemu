name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QEMU_TAG: v10.0.0

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: bash scripts/setup-deps.sh

      - name: Cache QEMU build
        uses: actions/cache@v5
        with:
          path: qemu
          # Invalidate on any overlay source, the target/riscv patch, or build.sh
          # (all feed scripts/build.sh: ws63.c, trans_xlinx, the qtest, trace events).
          key: qemu-${{ env.QEMU_TAG }}-${{ hashFiles('src/**', 'patches/**', 'scripts/build.sh') }}-${{ runner.os }}

      - name: Build qemu-system-riscv32 with the WS63 machine
        run: bash scripts/build.sh

      - name: Sanity — ws63 machine is registered
        run: ./qemu/build/qemu-system-riscv32 -M help | grep -q ws63

      - uses: astral-sh/setup-uv@v7

      - name: WS53 RAM-profile timer model contracts
        run: uv run --script scripts/test-ws53.py --qemu ./qemu/build/qemu-system-riscv32

      - name: WS53 Flash control-domain access and reset contracts
        run: |
          uv run --script scripts/ws53_tsensor_domain_test.py \
            --qemu ./qemu/build/qemu-system-riscv32 \
            --output "$RUNNER_TEMP/ws53-tsensor-domain"

      - name: Retain control-domain model observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws53-tsensor-control-domain
          path: ${{ runner.temp }}/ws53-tsensor-domain/
          if-no-files-found: warn

      - name: Shared interrupt priority and reset regression (six TCG machines)
        run: uv run --script scripts/hisi_priority_test.py --qemu ./qemu/build/qemu-system-riscv32

      - name: WS53 timer paused-clock fault contracts
        run: uv run --script scripts/ws53_timer_stall_test.py --qemu ./qemu/build/qemu-system-riscv32

      - name: WS53 unavailable counter CSR and older-machine regression
        run: uv run --script scripts/ws53_counter_csr_test.py --qemu ./qemu/build/qemu-system-riscv32

      - name: Checkout ws63-rs (firmware source)
        uses: actions/checkout@v5
        with:
          repository: hispark-rs/hisi-riscv-rs
          submodules: recursive
          path: ws63-rs

      - name: Install the firmware repository's pinned Rust toolchain
        working-directory: ws63-rs
        run: bash .github/scripts/install-toolchain.sh

      - name: Build example firmware
        working-directory: ws63-rs
        # Build the firmware repository's default-member libraries and examples.
        # smoke-test.sh also reports optional, separately built examples as SKIP.
        # Upstream rustc knows RV32IMFC, but rustup has no prebuilt core/alloc
        # for this target. Follow the firmware repository's build contract.
        run: cargo build -Zbuild-std=core,alloc --locked --release

      - name: Smoke test (run ws63-rs firmware on the WS63 machine)
        run: WS63_RS="$PWD/ws63-rs" bash scripts/smoke-test.sh

      # Boots the committed fbb_ws63 C SDK peripheral-sample ELFs (tests/csdk/) and
      # asserts each sample's UART marker — validates the peripheral models against
      # real vendor firmware. No SDK/toolchain needed (uses prebuilt fixtures).
      - name: C SDK peripheral-sample tests
        run: bash scripts/csdk-test.sh

      # Register-level, boot-free regression of the GPIO/UART/timer/INTC/DMA/
      # netmac models (drives MMIO directly via libqtest). Fast feedback on the
      # pinned QEMU here; the qtest-matrix workflow runs this same test across
      # multiple QEMU releases (out-of-tree-overlay drift radar).
      - name: QTest (register-level regression)
        run: bash scripts/qtest.sh
